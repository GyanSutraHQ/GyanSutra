name: Embedding compatibility diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: uv sync --frozen
        working-directory: backend
      - name: Compare the original JavaScript adapter on the same CPU
        run: |
          mkdir -p /tmp/embedding-reference
          cd /tmp/embedding-reference
          npm install --no-save @xenova/transformers@2.17.2
          cat > reference.mjs <<'JS'
          import fs from 'node:fs';
          import { pipeline, env } from '@xenova/transformers';
          const root = process.env.GITHUB_WORKSPACE + '/backend';
          env.allowRemoteModels = false;
          env.localModelPath = root + '/models/';
          const model = await pipeline('feature-extraction', 'Xenova/gte-small', { quantized: true });
          const cases = JSON.parse(fs.readFileSync(root + '/tests/fixtures/legacy_embeddings.json'));
          const outputs = [];
          for (const item of cases) {
            const input = item.text.replace(/\s+/g, ' ').trim();
            const tensor = await model(input, { pooling: 'mean', normalize: true });
            outputs.push({ ...item, vector: Array.from(tensor.data) });
          }
          fs.writeFileSync('/tmp/embedding-reference/javascript-linux.json', JSON.stringify(outputs));
          JS
          node reference.mjs
      - name: Measure native runtime differences
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import json, platform
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from gyansutra.embedding import LocalScriptureEmbeddings, ROOT
          cases = json.loads(Path('/tmp/embedding-reference/javascript-linux.json').read_text())
          mac = json.loads((ROOT/'tests/fixtures/legacy_embeddings.json').read_text())
          model = LocalScriptureEmbeddings()
          results = []
          try:
              for i, case in enumerate(cases):
                  actual = np.array(model.embed_query(case['text']) if case['inputType']=='query' else model.embed_documents([case['text']])[0])
                  legacy = np.array(case['vector'])
                  fixture = np.array(mac[i]['vector'])
                  results.append({'case':i,'pythonVsJavascriptCosine':float(actual@legacy),'maxAbsoluteDelta':float(abs(actual-legacy).max()),'linuxVsMacJavascriptCosine':float(legacy@fixture)})
          finally:
              model.close()
          print(json.dumps({'cpu':platform.machine(),'onnxruntime':ort.__version__,'results':results},indent=2))
          Path('/tmp/embedding-reference/comparison.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-compatibility
          path: /tmp/embedding-reference/*.json
