name: Maintainer CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch supersedes an older run. This keeps pull
# request feedback current without consuming unnecessary organization minutes.
concurrency:
  group: maintainer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contract and API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python dependency manager
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify scripture data contract
        run: uv run python -m scripts.verify_data

      - name: Run API, RAG, cache, narration, and localization tests
        run: uv run pytest

      - name: Lint and verify exported production dependencies
        run: |
          uv run ruff check gyansutra scripts tests
          uv run ruff format --check gyansutra scripts tests
          uv export --frozen --no-dev --no-header --format requirements-txt --output-file /tmp/gyansutra-requirements.txt
          diff requirements.txt /tmp/gyansutra-requirements.txt

      - name: Audit production dependencies
        run: uv run pip-audit -r requirements.txt --disable-pip

  frontend:
    name: Frontend quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run reader, narration, and recitation tests
        run: npm test

      - name: Lint source files
        run: npm run lint

      - name: Build PWA and static SEO pages
        run: npm run build

      - name: Reject critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload review build
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.event.pull_request.number }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  embedding-compatibility:
    name: Compare native embedding runtimes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: uv sync --frozen
        working-directory: backend
      - name: Compare the original JavaScript adapter on the same CPU
        run: |
          mkdir -p /tmp/embedding-reference
          cd /tmp/embedding-reference
          npm install --no-save @huggingface/transformers@4.3.0
          cat > reference.mjs <<'JS'
          import fs from 'node:fs';
          import { pipeline, env } from '@huggingface/transformers';
          const root = process.env.GITHUB_WORKSPACE + '/backend';
          env.allowRemoteModels = false;
          env.localModelPath = root + '/models/';
          const model = await pipeline('feature-extraction', 'Xenova/gte-small', { dtype: 'q8', device: 'cpu' });
          const cases = JSON.parse(fs.readFileSync(root + '/tests/fixtures/legacy_embeddings.json'));
          const outputs = [];
          for (const item of cases) {
            const input = item.text.replace(/\s+/g, ' ').trim();
            const tensor = await model(input, { pooling: 'mean', normalize: true });
            outputs.push({ ...item, vector: Array.from(tensor.data) });
          }
          fs.writeFileSync('/tmp/embedding-reference/javascript-linux.json', JSON.stringify(outputs));
          JS
          node reference.mjs
      - name: Measure native runtime differences
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import json, platform
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from gyansutra.embedding import LocalScriptureEmbeddings, ROOT
          cases = json.loads(Path('/tmp/embedding-reference/javascript-linux.json').read_text())
          mac = json.loads((ROOT/'tests/fixtures/legacy_embeddings.json').read_text())
          model = LocalScriptureEmbeddings()
          results = []
          try:
              for i, case in enumerate(cases):
                  actual = np.array(model.embed_query(case['text']) if case['inputType']=='query' else model.embed_documents([case['text']])[0])
                  legacy = np.array(case['vector'])
                  fixture = np.array(mac[i]['vector'])
                  results.append({'case':i,'pythonVsJavascriptCosine':float(actual@legacy),'maxAbsoluteDelta':float(abs(actual-legacy).max()),'linuxVsMacJavascriptCosine':float(legacy@fixture)})
          finally:
              model.close()
          print(json.dumps({'cpu':platform.machine(),'onnxruntime':ort.__version__,'results':results},indent=2))
          Path('/tmp/embedding-reference/comparison.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-compatibility
          path: /tmp/embedding-reference/*.json
