services:
  - type: web
    name: gyansutra-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gyansutra
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard - never committed
      - key: OPENROUTER_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false   # Paste the entire service account JSON here
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Cloudflare Pages URL e.g. https://gyansutra.pages.dev
      - key: GEMINI_GENERATION_MODELS
        value: gemini-3.8-flash,gemini-3.1-flash-lite
      - key: GROK_MODELS
        value: grok-4.7
      - key: RAG_PROVIDER_ORDER
        value: gemini,grok,openrouter
      - key: GEMINI_REASONING_EFFORT
        value: low
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.55"
      - key: RAG_TOP_K
        value: "20"
      - key: RAG_HYBRID_ENABLED
        value: "true"
      - key: RAG_MULTILINGUAL_QUERY_ENABLED
        value: "true"
      - key: RAG_QUERY_TRANSLATION_TIMEOUT_MS
        value: "4000"
      - key: RAG_MIN_LEXICAL_COVERAGE
        value: "0.6"
      - key: RAG_DIVERSITY_WEIGHT
        value: "0.2"
      - key: RAG_MAX_CONCURRENT_RETRIEVALS
        value: "8"
      - key: RAG_MAX_QUEUED_RETRIEVALS
        value: "32"
      - key: RAG_RETRIEVAL_QUEUE_TIMEOUT_MS
        value: "3000"
      - key: RAG_REQUEST_DEADLINE_MS
        value: "45000"
      - key: RAG_TOP_CONTEXT
        value: "4"
      - key: RAG_MAX_MODEL_ATTEMPTS
        value: "3"
      - key: RAG_MODEL_TIMEOUT_MS
        value: "10000"
      - key: RAG_GENERATION_DEADLINE_MS
        value: "24000"
      - key: RAG_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: RAG_MAX_CONCURRENT_GENERATIONS
        value: "4"
      - key: RAG_MAX_QUEUED_GENERATIONS
        value: "24"
      - key: RAG_MODEL_QUEUE_TIMEOUT_MS
        value: "10000"
      - key: RAG_CACHE_ENABLED
        value: "true"
      - key: RAG_CACHE_MAX_ENTRIES
        value: "250"
      - key: RAG_CORPUS_VERSION
        value: gita-ramayana-vishnu-purana-v1
      - key: EMBEDDING_PREWARM
        value: "true"
      - key: ASK_RATE_LIMIT_MAX
        value: "20"
      - key: TRUST_PROXY_HOPS
        value: "1"
