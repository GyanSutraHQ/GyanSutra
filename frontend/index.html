<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Gyan Sutra | Gita, Ramayana and Vishnu Purana</title>
    <meta name="description" content="Read the Bhagavad Gita, Valmiki Ramayana, and complete Vishnu Purana with source-grounded translations, notes, audio, and Sarathi guidance." />
    <meta name="keywords" content="Bhagavad Gita, Valmiki Ramayana, Vishnu Purana, Sanskrit, scripture, Gita, Hindu, dharma, Sarathi" />
    <meta name="author" content="Gyan Sutra" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- PWA - %BASE_URL% is substituted by Vite at build time for each deployment -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#F6EFDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1420" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gyan Sutra" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />

    <!-- Open Graph - og:image uses absolute HTTPS URL on Cloudflare -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Gyan Sutra" />
    <meta property="og:title" content="Gyan Sutra | Gita, Ramayana and Vishnu Purana" />
    <meta property="og:description" content="Read the Bhagavad Gita, Valmiki Ramayana, and complete Vishnu Purana with source-grounded translations and guidance." />
    <meta property="og:image" content="https://gyansutraapp.com/linkedin/gyan-sutra-linkedin-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Gyan Sutra scripture library" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gyan Sutra | Gita, Ramayana and Vishnu Purana" />
    <meta name="twitter:description" content="Read the Bhagavad Gita, Valmiki Ramayana, and complete Vishnu Purana with source-grounded translations and guidance." />
    <meta name="twitter:image" content="https://gyansutraapp.com/linkedin/gyan-sutra-linkedin-cover.png" />

    <!-- Prevent flash of wrong theme - apply before first paint -->
    <script>
      (function() {
        window.__gyanSutraBootStartedAt = performance.now();
        var stored = null;
        try { stored = localStorage.getItem('gyansutra-theme'); } catch (e) { /* use system theme */ }
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Critical boot layer: visible before the JavaScript bundle is parsed. -->
    <style>
      #gs-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f6efdd;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 160ms cubic-bezier(.2,.7,.2,1),
          visibility 0s linear 160ms;
      }
      [data-theme="dark"] #gs-boot-splash { background: #1c1420; }
      #gs-boot-splash.is-leaving { opacity: 0; visibility: hidden; }
      .gs-boot-splash__content {
        display: grid;
        justify-items: center;
        gap: 0.65rem;
        animation: gs-boot-arrive 240ms cubic-bezier(.2,.8,.2,1) both;
      }
      .gs-boot-splash__mark {
        position: relative;
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
      }
      .gs-boot-splash__mark::before {
        content: '';
        position: absolute;
        inset: 0;
        border: 1px solid rgba(190, 106, 46, .18);
        border-top-color: #be6a2e;
        border-radius: 50%;
        animation: gs-boot-turn 760ms linear infinite;
      }
      .gs-boot-splash__logo {
        width: 56px;
        height: 56px;
        filter: drop-shadow(0 4px 12px rgba(190, 106, 46, .16));
      }
      .gs-boot-splash__name {
        margin: 0;
        color: #241a2e;
        font: 600 1rem/1.2 Georgia, serif;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      [data-theme="dark"] .gs-boot-splash__name { color: #efe8f5; }
      .gs-boot-splash__pending {
        margin: -.15rem 0 0;
        color: #756a7d;
        font: 500 .72rem/1.4 system-ui, sans-serif;
        letter-spacing: .06em;
      }
      [data-theme="dark"] .gs-boot-splash__pending { color: #a59bb0; }
      .gs-boot-splash__recovery {
        display: none;
        max-width: 20rem;
        text-align: center;
        color: #756a7d;
        font: 500 .82rem/1.5 system-ui, sans-serif;
      }
      .gs-boot-splash__recovery p { margin: 0 0 .8rem; }
      .gs-boot-splash__recovery button {
        min-height: 2.5rem;
        padding: .55rem 1rem;
        border: 1px solid rgba(190, 106, 46, .48);
        border-radius: .65rem;
        background: rgba(190, 106, 46, .1);
        color: #5d321f;
        font: 600 .8rem/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .gs-boot-splash__recovery button:disabled { cursor: wait; opacity: .65; }
      [data-theme="dark"] .gs-boot-splash__recovery { color: #b9afc2; }
      [data-theme="dark"] .gs-boot-splash__recovery button { color: #efc17d; }
      #gs-boot-splash.is-stalled .gs-boot-splash__mark::before { animation: none; }
      #gs-boot-splash.is-stalled .gs-boot-splash__pending { display: none; }
      #gs-boot-splash.is-stalled .gs-boot-splash__recovery { display: block; }
      @keyframes gs-boot-arrive {
        from { opacity: 0; transform: translateY(4px) scale(.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes gs-boot-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .gs-boot-splash__content { animation: none; }
        .gs-boot-splash__mark::before { animation: none; }
        #gs-boot-splash { transition-duration: 80ms; }
      }
    </style>

  </head>
  <body>
    <div id="gs-boot-splash" aria-hidden="true">
      <div class="gs-boot-splash__content">
        <div class="gs-boot-splash__mark">
          <img class="gs-boot-splash__logo" src="%BASE_URL%icons/logo.svg" alt="" width="56" height="56" />
        </div>
        <p class="gs-boot-splash__name">Gyan Sutra</p>
        <p class="gs-boot-splash__pending">Opening the library</p>
        <div class="gs-boot-splash__recovery" role="status">
          <p>The library is taking longer to open.</p>
          <button id="gs-boot-retry" type="button">Refresh app</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var splash = document.getElementById('gs-boot-splash');
        var retry = document.getElementById('gs-boot-retry');
        var finished = false;

        window.__gyanSutraRevealApp = function() {
          if (finished || !splash) return;
          finished = true;
          window.clearTimeout(window.__gyanSutraBootWatchdog);
          splash.setAttribute('aria-hidden', 'true');
          splash.classList.add('is-leaving');
          window.setTimeout(function() { splash.remove(); }, 180);
        };

        async function refreshApp() {
          if (retry) {
            retry.disabled = true;
            retry.textContent = 'Refreshing';
          }
          try {
            if ('serviceWorker' in navigator) {
              var scope = new URL('%BASE_URL%', window.location.origin).href;
              var registration = await navigator.serviceWorker.getRegistration(scope);
              if (registration) await registration.unregister();
            }
            if ('caches' in window) {
              var names = await window.caches.keys();
              await Promise.all(names.filter(function(name) {
                return /precache|workbox/i.test(name);
              }).map(function(name) { return window.caches.delete(name); }));
            }
          } catch (error) {
            console.warn('App cache refresh was incomplete.', error);
          }
          window.location.reload();
        }

        if (retry) retry.addEventListener('click', refreshApp);

        window.__gyanSutraBootWatchdog = window.setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            window.__gyanSutraRevealApp();
            return;
          }
          splash.removeAttribute('aria-hidden');
          splash.classList.add('is-stalled');
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
